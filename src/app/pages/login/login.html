<main class="container">
  <h3>Ingrese sus datos para iniciar sesión</h3>
  <div class="container border border-dark rounded p-4 my-4" style="max-width: 480px">
    <form id="formLogin" class="row g-3 text-start" (ngSubmit)="ingresar()">
      <div class="col-12">
        <label for="userMail" class="form-label">Correo electrónico</label>
        <input
          class="form-control"
          type="email"
          name="userMail"
          id="userMail"
          placeholder="E-mail"
          [(ngModel)]="datos.correo"
        />
      </div>
      <span id="errorUser" class="text-danger"></span>
      <div class="col-12">
        <label for="contrasenia" class="form-label">Contraseña</label>
        <input
          class="form-control"
          type="password"
          name="contrasenia"
          id="contrasenia"
          placeholder="Contraseña"
          [(ngModel)]="datos.password"
        />
      </div>
      @if (error) {
        <span id="errorPass" class="text-danger">{{ error }}</span>
      }
      <a routerLink="/recuperar">Recuperar Contraseña</a>
      <div class="col-12">
        <button id="login" type="submit" class="btn btn-primary">Iniciar Sesión</button>
      </div>
    </form>
  </div>
</main>
