<main>
  <h2 class="h2">Categorias</h2>
  <div class="container">
    <div class="row">
      @for (c of categorias; track c.id) {
        <div class="col-12 col-sm-6 col-lg-3 mb-4">
          <div class="card h-100">
            <img class="card-img-top" [src]="c.imagen" [alt]="c.nombre" />
            <div class="card-body d-flex flex-column">
              <h3 class="card-title">{{ c.nombre }}</h3>
              <a class="btn btn-primary mt-auto" [routerLink]="['/categoria', c.id]">Ver más</a>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</main>
